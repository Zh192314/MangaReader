name: Build IPA

# 触发方式：
#   1. push 到 main / master（只出未签名 ipa，作为产物 artifact）
#   2. 打 tag v1.4.0 之类（额外建一个 Release，把 ipa 挂上去，可直接下载）
#   3. Actions 页面点 "Run workflow" 手动跑
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # 1. 未签名 ipa：TrollStore 直接装，Sideloadly / AltStore 自己签
  # ─────────────────────────────────────────────
  unsigned:
    name: Unsigned IPA
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        run: |
          xcodebuild -version
          sw_vers
          echo "runner arch: $(uname -m)"

      - name: 定位工程目录
        id: locate
        run: |
          if [ -f project.yml ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f MangaReader/project.yml ]; then
            echo "dir=MangaReader" >> "$GITHUB_OUTPUT"
          else
            echo "::error::找不到 project.yml（仓库根和 MangaReader/ 下都没有）"
            exit 1
          fi

      - name: 安装 XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install xcodegen
          fi
          xcodegen --version

      - name: 生成 Xcode 工程
        working-directory: ${{ steps.locate.outputs.dir }}
        run: xcodegen generate

      - name: 编译（关闭签名）
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          set -o pipefail
          xcodebuild \
            -project MangaReader.xcodeproj \
            -scheme MangaReader \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -archivePath build/MangaReader.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            archive

      - name: 打成 ipa
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          set -euo pipefail
          APP="build/MangaReader.xcarchive/Products/Applications/MangaReader.app"
          if [ ! -d "$APP" ]; then
            echo "::error::archive 里没有 MangaReader.app"
            ls -R build/MangaReader.xcarchive/Products || true
            exit 1
          fi
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build
          zip -qry MangaReader-unsigned.ipa Payload
          echo "── ipa 内容 ──"
          unzip -l MangaReader-unsigned.ipa | sed -n '1,15p'
          ls -lh MangaReader-unsigned.ipa
          echo "version: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Payload/MangaReader.app/Info.plist)"
          echo "build:   $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Payload/MangaReader.app/Info.plist)"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: MangaReader-unsigned-ipa
          path: ${{ steps.locate.outputs.dir }}/build/MangaReader-unsigned.ipa
          retention-days: 30
          if-no-files-found: error

  # ─────────────────────────────────────────────
  # 2. 打 tag 时建 Release，把 ipa 挂上去（免登录下载）
  # ─────────────────────────────────────────────
  release:
    name: Publish Release
    needs: unsigned
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MangaReader-unsigned-ipa
          path: dist

      - name: 建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MangaReader-unsigned.ipa
          generate_release_notes: true
          body: |
            未签名 IPA —— TrollStore 可直接安装；Sideloadly / AltStore / SideStore 用它自动重签后安装。

            自签方式见仓库里的 `SIGNING.md`。

  # ─────────────────────────────────────────────
  # 3. 可选：用你自己的证书签出一个能直装的 ipa
  #    需要先在仓库 Settings 里配置下面这 5 个 Secrets，
  #    并把 Settings → Variables 里的 ENABLE_SIGNING 设为 true。
  # ─────────────────────────────────────────────
  signed:
    name: Signed IPA (optional)
    if: vars.ENABLE_SIGNING == 'true'
    runs-on: macos-15
    env:
      CERT_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      CERT_PASSWORD: ${{ secrets.P12_PASSWORD }}
      PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: ${{ secrets.APP_BUNDLE_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: 定位工程目录
        id: locate
        run: |
          if [ -f project.yml ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f MangaReader/project.yml ]; then
            echo "dir=MangaReader" >> "$GITHUB_OUTPUT"
          else
            echo "::error::找不到 project.yml"
            exit 1
          fi

      - name: 导入证书与描述文件
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          echo -n "$CERT_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"

          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

          PROFILE_NAME=$(security cms -D -i "$PROFILE_PATH" | /usr/libexec/PlistBuddy -c 'Print :Name' /dev/stdin)
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "描述文件：$PROFILE_NAME"

      - name: 安装 XcodeGen 并生成工程
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          command -v xcodegen >/dev/null 2>&1 || HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          xcodegen generate

      - name: 编译并签名
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          set -o pipefail
          xcodebuild \
            -project MangaReader.xcodeproj \
            -scheme MangaReader \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -archivePath build/MangaReader.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            archive

      - name: 导出 ipa
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          set -euo pipefail
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>development</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key><string>$PROFILE_NAME</string>
            </dict>
            <key>compileBitcode</key><false/>
            <key>stripSwiftSymbols</key><true/>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/MangaReader.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist
          cp build/export/*.ipa build/MangaReader-signed.ipa
          ls -lh build/MangaReader-signed.ipa

      - name: 上传签名 ipa
        uses: actions/upload-artifact@v4
        with:
          name: MangaReader-signed-ipa
          path: ${{ steps.locate.outputs.dir }}/build/MangaReader-signed.ipa
          retention-days: 30
          if-no-files-found: error

      - name: 清理 keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
